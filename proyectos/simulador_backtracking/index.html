<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../global.css" />
    <title>Simulador de laberintos</title>
    <link rel="stylesheet" href="styles.css" />

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

</head>

<body>
    <a href="../index.html" class="btn-home-global"><i class="fas fa-home"></i> Volver al Inicio</a>


    <h1>Simulador de Backtracking</h1>
    <p class="desc">
        Visualiza como el algoritmo de <b>Backtracking</b> utiliza una <b>Pila</b> para explorar laberintos,
        retrocediendo estategicamente cuando encuentra un camino sin salida.
    </p>

    <div class="controls glass-panel">
        <div class="control-group">
            <label for="mazeSelector">Presets:</label>
            <select id="mazeSelector">
                <option value="easy">Laberinto fácil</option>
                <option value="no-solution">Sin solucion</option>
                <option value="multiple">Multiples soluciones</option>
                <option value="random">Laberinto aleatorio</option>
            </select>
        </div>

        <div class="control-group" id="randomControls" style="display: none;">
            <button id="generateBtn" class="btn-accent"><i class="fas fa-random"></i> Generar laberinto</button>
        </div>

        <div class="control-group">
            <label>Archivo (5x5):</label>
            <input type="file" id="fileInput" accept=".txt" style="display: none;">
            <button id="uploadBtn" class="btn-success"><i class="fas fa-upload"></i> Subir .txt</button>
        </div>

        <div class="button-group">
            <button id="stepBtn" class="btn-info"><i class="fas fa-route"></i> Paso a Paso</button>
            <button id="autoBtn" class="btn-primary"><i class="fas fa-play"></i> Simulación Automática</button>
            <button id="resetBtn" class="secondary"><i class="fas fa-redo"></i> Reset</button>
        </div>
    </div>

    <main class="main-layout">
        <section class="viz-section glass-panel">
            <h2>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="9" y1="3" x2="9" y2="21"></line>
                    <line x1="15" y1="3" x2="15" y2="21"></line>
                    <line x1="3" y1="9" x2="21" y2="9"></line>
                    <line x1="3" y1="15" x2="21" y2="15"></line>
                </svg>
                Laberinto
            </h2>
            <div id="maze"></div>
        </section>

        <section class="viz-section glass-panel">
            <h2>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                </svg>
                Pila (Stack)
            </h2>
            <div id="stack-container">
                <!-- Stack items will be injected here -->
            </div>
        </section>
    </main>

    <div class="status-bar glass-panel">
        <div class="status-indicator">
            <span class="dot" id="status-dot"></span>
            <span id="status-text">Listo para iniciar</span>
        </div>
        <div id="step-counter">Pasos: 0</div>
    </div>

    <script src="script.js"></script>
</body>

</html>
